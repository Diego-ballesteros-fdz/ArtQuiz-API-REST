services:
  db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: Admin123.
      POSTGRES_USER: Admin
      POSTGRES_DB: artquiz_db
    ports:
      - "5432:5432"
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
volumes:
  postgres_data: